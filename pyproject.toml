[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h1cli"
version = "0.1.0"
description = "HackerOne bounty program CLI — search, browse, and analyze bug bounty programs from the terminal"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "truen"}
]
dependencies = [
    "httpx>=0.25.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]
[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-httpx>=0.30.0",
    "pytest-mock>=3.12.0",
]
dev = [
    "h1cli[test]",
]

[project.scripts]
h1 = "h1cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/h1cli"]
